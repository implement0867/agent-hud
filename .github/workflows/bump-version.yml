# Bump the versions that a merged pull request changes, in a commit to main.
# The UI and the server have their own versions; the plugin, which ships both, is bumped with either of them.
name: Bump version

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Bump the versions
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LEVEL: ${{ contains(github.event.pull_request.labels.*.name, 'major') && 'major' || contains(github.event.pull_request.labels.*.name, 'minor') && 'minor' || 'patch' }}
        run: |
          next() {
            IFS=. read -r major minor patch <<<"$1"
            case $LEVEL in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              patch) echo "$major.$minor.$((patch + 1))" ;;
            esac
          }
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          changed() { grep -qE "$1" <<<"$files"; }
          bumped=()
          if changed '^ui/'; then
            version=$(next "$(jq -r .version ui/package.json)")
            (cd ui && npm version "$version" --no-git-tag-version)
            bumped+=("the UI to $version")
          fi
          if changed '^server/'; then
            (cd server && uv version --bump "$LEVEL" --no-sync)
            bumped+=("the server to $(cd server && uv version --short)")
          fi
          if changed '^(ui|server|hooks|commands|skills|\.claude-plugin)/'; then
            plugin=$(next "$(jq -r .version .claude-plugin/plugin.json)")
            jq --arg v "$plugin" '.version = $v' .claude-plugin/plugin.json >plugin.json.new
            mv plugin.json.new .claude-plugin/plugin.json
            bumped+=("the plugin to $plugin")
          fi
          if [ ${#bumped[@]} -eq 0 ]; then
            echo "#$PR changes nothing that has a version"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          list=$(printf '%s, ' "${bumped[@]}" | sed 's/, $//; s/\(.*\), /\1 and /')
          git commit -am "Bump $list for #$PR"
          git pull --rebase origin main
          [ -z "$plugin" ] || git tag "v$plugin"
          git push --atomic origin main ${plugin:+"v$plugin"}
